name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HF token
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "::error::HF_TOKEN is missing. Add it under GitHub → Settings → Secrets → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Sync files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf auth login --token "$HF_TOKEN"
          echo "Uploading README.md with Docker Space config first..."
          hf upload Woodiee/MindRAG README.md --repo-type space --commit-message "Fix HF Space README metadata"
          echo "Uploading project files..."
          hf upload Woodiee/MindRAG . \
            --repo-type space \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "frontend/node_modules/*" \
            --exclude "backend/.venv/*" \
            --commit-message "Sync project files from GitHub"
